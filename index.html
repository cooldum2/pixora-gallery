<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيكسورا (Pixora) | معرض الصور المجاني والخلفيات عالية الجودة</title>
    <meta name="description" content="اكتشف وحمّل أجمل الصور والخلفيات عالية الدقة مجاناً على موقع بيكسورا Pixora. صور متنوعة وسريعة التحميل.">
    <meta name="keywords" content="صور, خلفيات, تحميل صور مجانا, بيكسورا, pixora, صور عالية الجودة, wallpapers">
    
    <!-- ========================================================= -->
    <!-- ضع هنا أكواد التفعيل أو السكربتات العامة (مثل Social Bar / Popunder) -->
    <!-- ========================================================= -->

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-color);
        }

        .brand h1 {
            font-size: 1.6rem;
            color: var(--accent);
            font-weight: 800;
        }

        .brand span {
            font-size: 0.9rem;
            color: var(--muted-text);
            letter-spacing: 1px;
        }

        .search-box {
            flex: 1;
            max-width: 420px;
        }

        .search-box input {
            width: 100%;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        /* Ad Slots */
        .ad-container {
            max-width: 1200px;
            margin: 1.2rem auto;
            padding: 0.75rem;
            background: rgba(30, 41, 59, 0.6);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ad-label {
            font-size: 0.72rem;
            color: var(--muted-text);
            margin-bottom: 0.3rem;
        }

        /* Categories */
        .categories {
            max-width: 1200px;
            margin: 1rem auto;
            padding: 0 5%;
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.4rem;
        }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.45rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Thumbnails Grid */
        .gallery {
            max-width: 1200px;
            margin: 1rem auto 2.5rem;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.2rem;
        }

        .thumb-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .thumb-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .thumb-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .thumb-info {
            padding: 0.75rem 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .thumb-badge {
            font-size: 0.75rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.88);
            z-index: 999;
            overflow-y: auto;
            padding: 1.5rem 5%;
        }

        .modal.open {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 780px;
            width: 100%;
            padding: 1.5rem;
            position: relative;
            margin: auto;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: #334155;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #ef4444;
        }

        .modal-details {
            margin-bottom: 1rem;
            padding-left: 2.5rem;
        }

        .modal-details h2 {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .modal-meta {
            font-size: 0.85rem;
            color: var(--muted-text);
        }

        .modal-image-wrapper {
            text-align: center;
            margin: 1rem 0;
        }

        .modal-image-wrapper img {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 10px;
            object-fit: contain;
        }

        .download-actions {
            display: flex;
            justify-content: center;
            margin-top: 1.2rem;
        }

        .download-btn {
            background: var(--success);
            color: #fff;
            text-decoration: none;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            padding: 2rem 5%;
            border-top: 1px solid var(--border-color);
            color: var(--muted-text);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <h1>بيكسورا</h1>
            <span>PIXORA</span>
        </a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن صورة أو خلفية...">
        </div>
    </header>

    <!-- إعلان أعلى الصفحة الرئيسية -->
    <div id="main-top-ad" class="ad-container">
        <div class="ad-label">إعلان ممول</div>
        <!-- الصق كود الوحدة الإعلانية العلوية هنا -->
        <p style="color:#94a3b8; font-size:0.85rem;">مساحة مخصصة لكود الإعلان العلوي (#main-top-ad)</p>
    </div>

    <!-- تصنيفات الصور -->
    <div class="categories" id="categoriesBar">
        <button class="cat-btn active" data-cat="الكل">الكل</button>
        <button class="cat-btn" data-cat="طبيعة">طبيعة</button>
        <button class="cat-btn" data-cat="تقنية">تقنية</button>
        <button class="cat-btn" data-cat="تصاميم">تصاميم</button>
        <button class="cat-btn" data-cat="معمارية">معمارية</button>
    </div>

    <!-- شبكة مصغرات الصور -->
    <main class="gallery" id="galleryGrid"></main>

    <!-- النافذة المنبثقة لعرض الصورة وتفاصيلها والتحميل -->
    <div class="modal" id="photoModal" aria-hidden="true">
        <div class="modal-content">
            <button class="close-btn" id="closeModal" title="إغلاق">&times;</button>

            <div class="modal-details">
                <h2 id="modalTitle">عنوان الصورة</h2>
                <p class="modal-meta" id="modalMeta">التصنيف • الأبعاد • الصيغة</p>
            </div>

            <!-- 1. وحدة إعلانية أعلى الصورة داخل النافذة -->
            <div id="modal-top-ad" class="ad-container">
                <div class="ad-label">إعلان</div>
                <!-- الصق كود الإعلان أعلى الصورة هنا -->
                <p style="color:#94a3b8; font-size:0.85rem;">مساحة إعلانية أعلى الصورة (#modal-top-ad)</p>
            </div>

            <div class="modal-image-wrapper">
                <img id="modalImg" src="" alt="">
            </div>

            <!-- 2. وحدة إعلانية أسفل الصورة داخل النافذة -->
            <div id="modal-bottom-ad" class="ad-container">
                <div class="ad-label">إعلان</div>
                <!-- الصق كود الإعلان أسفل الصورة هنا -->
                <p style="color:#94a3b8; font-size:0.85rem;">مساحة إعلانية أسفل الصورة (#modal-bottom-ad)</p>
            </div>

            <!-- 3. زر التحميل -->
            <div class="download-actions">
                <button class="download-btn" id="downloadBtn">تحميل الصورة الآن</button>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; <span id="year"></span> بيكسورا (Pixora)
    </footer>

    <script>
        // استبدل هذه البيانات بصورك الخاصة (مثلاً: images/photo1.jpg)
        const imagesData = [
            {
                id: 1,
                title: "شروق الشمس فوق الجبال",
                category: "طبيعة",
                resolution: "1920x1080",
                format: "JPG",
                thumb: "https://picsum.photos/id/1018/600/400",
                full: "https://picsum.photos/id/1018/1920/1080"
            },
            {
                id: 2,
                title: "غابة ضبابية هادئة",
                category: "طبيعة",
                resolution: "1920x1280",
                format: "JPG",
                thumb: "https://picsum.photos/id/1015/600/400",
                full: "https://picsum.photos/id/1015/1920/1280"
            },
            {
                id: 3,
                title: "مساحة عمل وتطوير حديثة",
                category: "تقنية",
                resolution: "1600x1067",
                format: "JPG",
                thumb: "https://picsum.photos/id/180/600/400",
                full: "https://picsum.photos/id/180/1600/1067"
            },
            {
                id: 4,
                title: "جسر معلق في المدينة",
                category: "معمارية",
                resolution: "1920x1280",
                format: "JPG",
                thumb: "https://picsum.photos/id/1033/600/400",
                full: "https://picsum.photos/id/1033/1920/1280"
            },
            {
                id: 5,
                title: "تدرجات لونية وتكوين بصري",
                category: "تصاميم",
                resolution: "1600x1200",
                format: "JPG",
                thumb: "https://picsum.photos/id/1043/600/400",
                full: "https://picsum.photos/id/1043/1600/1200"
            },
            {
                id: 6,
                title: "طريق ساحلي وسط الطبيعة",
                category: "معمارية",
                resolution: "1920x1080",
                format: "JPG",
                thumb: "https://picsum.photos/id/1040/600/400",
                full: "https://picsum.photos/id/1040/1920/1080"
            }
        ];

        const galleryGrid = document.getElementById("galleryGrid");
        const searchInput = document.getElementById("searchInput");
        const categoriesBar = document.getElementById("categoriesBar");
        const modal = document.getElementById("photoModal");
        const closeModal = document.getElementById("closeModal");
        const modalTitle = document.getElementById("modalTitle");
        const modalMeta = document.getElementById("modalMeta");
        const modalImg = document.getElementById("modalImg");
        const downloadBtn = document.getElementById("downloadBtn");

        let currentCategory = "الكل";
        let selectedPhoto = null;

        document.getElementById("year").textContent = new Date().getFullYear();

        function renderGallery() {
            const query = searchInput.value.trim().toLowerCase();
            const filtered = imagesData.filter(item => {
                const matchCat = currentCategory === "الكل" || item.category === currentCategory;
                const matchText = item.title.toLowerCase().includes(query) || item.category.toLowerCase().includes(query);
                return matchCat && matchText;
            });

            galleryGrid.innerHTML = "";

            if (filtered.length === 0) {
                galleryGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#94a3b8;">لا توجد صور مطابقة للبحث.</p>`;
                return;
            }

            filtered.forEach(photo => {
                const card = document.createElement("div");
                card.className = "thumb-card";
                card.innerHTML = `
                    <img src="${photo.thumb}" alt="${photo.title}" loading="lazy">
                    <div class="thumb-info">
                        <span class="thumb-title">${photo.title}</span>
                        <span class="thumb-badge">${photo.category}</span>
                    </div>
                `;
                card.addEventListener("click", () => openPhotoModal(photo));
                galleryGrid.appendChild(card);
            });
        }

        function openPhotoModal(photo) {
            selectedPhoto = photo;
            modalTitle.textContent = photo.title;
            modalMeta.textContent = `التصنيف: ${photo.category} • الأبعاد: ${photo.resolution} • الصيغة: ${photo.format}`;
            modalImg.src = photo.full;
            modalImg.alt = photo.title;
            modal.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closePhotoModal() {
            modal.classList.remove("open");
            document.body.style.overflow = "";
            modalImg.src = "";
        }

        downloadBtn.addEventListener("click", async () => {
            if (!selectedPhoto) return;
            try {
                const response = await fetch(selectedPhoto.full);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `pixora-${selectedPhoto.id}.${selectedPhoto.format.toLowerCase()}`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                window.open(selectedPhoto.full, "_blank");
            }
        });

        searchInput.addEventListener("input", renderGallery);

        categoriesBar.addEventListener("click", (e) => {
            if (e.target.classList.contains("cat-btn")) {
                document.querySelectorAll(".cat-btn").forEach(btn => btn.classList.remove("active"));
                e.target.classList.add("active");
                currentCategory = e.target.dataset.cat;
                renderGallery();
            }
        });

        closeModal.addEventListener("click", closePhotoModal);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closePhotoModal();
        });

        renderGallery();
    </script>
</body>
</html>
